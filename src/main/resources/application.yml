spring:
  application:
    name: matchbook

  datasource:
    url: jdbc:postgresql://localhost:5432/matchbook
    username: matchbook
    password: matchbook

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  docker:
    compose:
      enabled: false

logging:
  level:
    com.monty.matchbook: DEBUG

matchbook:
  tick-size: 0.01
